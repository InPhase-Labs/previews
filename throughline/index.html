<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Throughline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: black app bar with role switcher; coach gets a tabbed workspace (overview, intake, interviews, synthesis, timeline, people, admin); sponsor and interviewees get a single report page they can respond to. */
:root{
  --bg:#FFFFFF; --surface:#F5F6F4; --surface2:#FAFBFA; --line:#DADDD9; --fg:#0E0F0E; --muted:#565B57;
  --accent:#3DFF8A; --on-accent:#0E0F0E; --accent-ink:#1F8A4C; --bar:#14213D; --bar-fg:#FFFFFF; --bar-muted:#B4BCD0; --logo-ring:#14213D; --logo-lines:#FFFFFF; --logo-word:#14213D;
  --sel:#F0FAF4; --ok-bg:#E3F5EA; --ok-fg:#14663A; --warn-bg:#FFF4E5; --warn-line:#E8B36A; --warn-fg:#7A4300;
  --bad-bg:#FDECEC; --bad-line:#E3A0A0; --bad-fg:#9B1C1C; --info-bg:#E8F0FB; --info-fg:#1D4E89;
  --track:#E7E9E6; --shadow:0 1px 2px rgba(14,15,14,.06);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F0E; --surface:#161917; --surface2:#121513; --line:#2C302D; --fg:#ECEFEC; --muted:#A3A9A4;
  --accent:#3DFF8A; --on-accent:#0E0F0E; --accent-ink:#3DFF8A; --bar:#0E1730; --bar-fg:#FFFFFF; --bar-muted:#A9B2C8; --logo-ring:#FFFFFF; --logo-lines:#14213D; --logo-word:#ECEFEC;
  --sel:#13231A; --ok-bg:#13301F; --ok-fg:#7EE6A8; --warn-bg:#2E2414; --warn-line:#8A6420; --warn-fg:#F2C27A;
  --bad-bg:#2E1616; --bad-line:#7A3434; --bad-fg:#F2A3A3; --info-bg:#15243A; --info-fg:#9CC3F2;
  --track:#262A27; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F0E; --surface:#161917; --surface2:#121513; --line:#2C302D; --fg:#ECEFEC; --muted:#A3A9A4;
  --accent:#3DFF8A; --on-accent:#0E0F0E; --accent-ink:#3DFF8A; --bar:#0E1730; --bar-fg:#FFFFFF; --bar-muted:#A9B2C8; --logo-ring:#FFFFFF; --logo-lines:#14213D; --logo-word:#ECEFEC;
  --sel:#13231A; --ok-bg:#13301F; --ok-fg:#7EE6A8; --warn-bg:#2E2414; --warn-line:#8A6420; --warn-fg:#F2C27A;
  --bad-bg:#2E1616; --bad-line:#7A3434; --bad-fg:#F2A3A3; --info-bg:#15243A; --info-fg:#9CC3F2;
  --track:#262A27; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);margin:0}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.mono{font-family:var(--mono)}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}

/* app bar */
.bar{background:var(--bar);color:var(--bar-fg)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.brand small{font:400 13px var(--sans);color:var(--bar-muted)}
.calogo{display:block;height:40px;width:auto;max-width:100%}
.logotile{display:inline-flex;background:#FFFFFF;border-radius:6px;padding:3px 8px}
.rlogo{display:inline-flex;background:#FFFFFF;border-radius:6px;padding:4px 10px;border:1px solid var(--line)}
.brand .rule{width:1px;align-self:stretch;background:rgba(255,255,255,.22);margin:2px 4px}
.brand .app{display:flex;flex-direction:column;line-height:1.2}
.brand .app b{font:600 19px var(--sans);letter-spacing:.01em}
.rlogo .calogo{height:50px}
.sitefoot{border-top:1px solid var(--line);background:var(--surface2)}
.sitefoot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 24px;padding-block:18px;font-size:13px;color:var(--muted)}
.sitefoot a{color:var(--fg);font-weight:500;text-underline-offset:3px}
.sitefoot .ip{display:inline-flex;align-items:center;gap:8px}
.roles{display:flex;flex-wrap:wrap;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:8px}
.roles button{border:0;background:transparent;color:var(--bar-muted);min-height:36px;padding:0 12px;border-radius:5px;cursor:pointer;font-size:13.5px}
.roles button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.roles .lbl{font:500 11px var(--mono);color:var(--bar-muted);padding:0 6px;align-self:center;letter-spacing:.06em}

/* buttons + fields */
.btn{min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--fg);background:var(--bg);cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--on-accent);font-weight:600}
.btn.quiet{border-color:var(--line)}
.btn.danger{border-color:var(--bad-line);color:var(--bad-fg);background:var(--bg)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:6px 0;cursor:pointer;font-weight:500;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px;min-height:32px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;font-weight:600}
.field input,.field select,.inp,select.inp{min-height:44px;border:1px solid var(--line);border-radius:6px;padding:0 12px;background:var(--surface2);color:var(--fg);width:100%}
.hint{font-size:12.5px;color:var(--muted)}

/* page head + tabs */
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding-top:28px}
.head h1{font-size:clamp(24px,3vw,30px);font-weight:600;margin:6px 0 4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabs{display:flex;gap:2px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{flex:none;border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-size:15px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);font-weight:600;border-bottom-color:var(--fg)}
.tabs .count{font:500 11px var(--mono);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1px 7px;margin-left:6px}
.tabs .dotn{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn-line);margin-left:6px;vertical-align:middle}

main{padding-block:24px 56px}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.grow{flex:999 1 560px;min-width:0}
.side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--bg);box-shadow:var(--shadow);overflow:hidden}
.panel-h{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px}
.panel-h h2{font-size:17px;font-weight:600}
.pad{padding:18px 20px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

/* pills */
.pill{flex:none;display:inline-block;font:500 11px var(--mono);padding:4px 8px;border-radius:4px;white-space:nowrap;letter-spacing:.02em}
.pill.syn,.pill.live,.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.in{background:var(--fg);color:var(--bg)}
.pill.sch,.pill.draft,.pill.neutral{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.pill.info{background:var(--info-bg);color:var(--info-fg)}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpis>div{background:var(--bg);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpis b{font:600 26px var(--mono);font-variant-numeric:tabular-nums}
.kpis .sub{font-size:13px;color:var(--muted)}
.kpis .lbl{font:500 11px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.todo{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.todo:first-child{border-top:0}
.todo input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent-ink);flex:none}
.todo label{flex:1;min-width:0;cursor:pointer}
.todo.done label{color:var(--muted);text-decoration:line-through}
.todo .go{flex:none}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:10px 20px;border-top:1px solid var(--line);font-size:14px}
.feed li:first-child{border-top:0}
.feed .t{font:500 12px var(--mono);color:var(--muted);padding-top:2px}
.proj{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.proj:first-child{border-top:0}
.proj b{font-weight:600;display:block;font-size:14px}

/* intake */
.drop{border:2px dashed var(--line);border-radius:10px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface2);transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent-ink);background:var(--sel)}
.drop svg{width:40px;height:28px}
.drop b{font-size:17px}
.srcs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.src{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:44px}
.src:hover{border-color:var(--muted)}
.src[aria-pressed="true"]{border-color:var(--fg);background:var(--surface)}
.src b{font-weight:600;font-size:14px}
.src span{font-size:12.5px;color:var(--muted)}
.paste{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:500 11.5px var(--mono);letter-spacing:.06em;color:var(--muted);background:var(--surface);padding:10px 12px;white-space:nowrap}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
th.c,td.c{text-align:center}
td{padding:12px 12px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px}
td .fn{font-weight:500;word-break:break-all}
tr.on td{background:var(--sel)}
td select.inp{min-height:36px;font-size:13px;padding:0 8px;min-width:150px}
.spin{display:inline-flex;align-items:center;gap:8px}
.wave{width:44px;height:16px}
.wave path{stroke:var(--accent-ink);fill:none;stroke-width:2;stroke-dasharray:60;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-120}}

/* notes */
.ilist{flex:1 1 280px;max-width:360px;display:flex;flex-direction:column;gap:8px}
.ilist-h{display:flex;justify-content:space-between;align-items:center;padding:0 4px 2px}
.irow{width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);cursor:pointer}
.irow:hover{border-color:var(--muted)}
.irow[aria-current="true"]{border-color:var(--fg);background:var(--surface)}
.irow b{font-weight:500;display:block}
.irow span.sub{font-size:13px;color:var(--muted)}
.editor{display:flex;flex-wrap:wrap}
.editor .write{flex:999 1 360px;min-width:0;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.srcline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
textarea{min-height:340px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:14px;font:15px/1.6 var(--sans);color:var(--fg);background:var(--surface2);width:100%}
.found{flex:1 1 260px;min-width:0;padding:18px 20px;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.found h3{font-size:13px;font-weight:600;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--fg)}
.note{font-size:14px;line-height:1.45;padding:10px 12px;background:var(--bg);border-radius:6px;border:1px solid var(--line)}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.reading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}

/* synthesis */
.syntable{min-width:640px}
.tpick{all:unset;cursor:pointer;display:block}
.tpick:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px}
.tpick b{font-weight:600;display:block;font-size:15px}
.tpick span{font-size:13px;color:var(--muted)}
.meter{display:flex;align-items:center;gap:10px}
.meter .trk{flex:1;height:8px;background:var(--track);border-radius:4px;overflow:hidden;min-width:70px}
.meter .fill{height:8px;background:var(--accent-ink)}
.meter .n{font:500 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{position:relative;display:inline-block;width:44px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:13px;background:var(--track);border:1px solid var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;width:20px;height:20px;top:2px;left:2px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked+span{background:var(--accent);border-color:var(--on-accent)}
.sw input:checked+span::after{transform:translateX(18px);background:#0E0F0E}
.sw input:focus-visible+span{outline:2px solid var(--accent-ink);outline-offset:2px}
.sw input:disabled{cursor:not-allowed}
.sw input:disabled+span{opacity:.45}
.lock{font:500 11px var(--mono);color:var(--muted)}
.tnote{padding:12px 20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--surface2)}
.ev{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 14px;background:var(--surface);border-radius:6px}
.ev q{flex:999 1 340px}
.ev span{flex:1 1 180px;font-size:13px;color:var(--muted)}
.views .vrow{display:flex;flex-direction:column;gap:4px;padding:16px 18px}
.views .vrow+.vrow{border-top:1px solid var(--line)}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.darkhead{background:var(--bar);color:var(--bar-fg);padding:13px 18px;font-weight:600;font-size:15px}
.checks{display:flex;flex-direction:column;gap:8px;font-size:14px}
.checks .ok::before{content:"✓ ";color:var(--accent-ink);font-weight:700}
.checks .todoi{color:var(--warn-fg)}
.checks .todoi::before{content:"! ";font-weight:700}
.confirm{border:1px solid var(--fg);border-radius:10px;padding:16px 18px;background:var(--surface)}
.confirm p{margin:0 0 12px;font-size:14px}
.confirm.danger{border-color:var(--bad-line);background:var(--bad-bg)}
ul.plain{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px}

/* timeline */
.gantt{min-width:760px;padding:8px 20px 18px}
.gscale{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;font:500 11.5px var(--mono);color:var(--muted);letter-spacing:.06em}
.gmonths{display:grid;position:relative;border-bottom:1px solid var(--line)}
.gmonths span{padding:8px 0 6px 6px;border-left:1px solid var(--line)}
.grow2{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.grow2 .gl b{display:block;font-weight:600;font-size:14px}
.grow2 .gl span{font-size:12.5px;color:var(--muted)}
.gtrack{position:relative;height:30px}
.gbar{position:absolute;top:6px;height:18px;border-radius:4px;background:var(--track);border:1px solid var(--line)}
.gbar.done{background:var(--fg);border-color:var(--fg)}
.gbar.now{background:var(--accent);border-color:var(--on-accent)}
.gbar.next{background:var(--surface);border:1px dashed var(--muted)}
.gms{position:absolute;top:8px;width:14px;height:14px;transform:translateX(-7px) rotate(45deg);background:var(--accent-ink)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--warn-fg)}
.gtoday-l{position:absolute;top:-2px;transform:translateX(-50%);font:600 10.5px var(--mono);color:var(--warn-fg);background:var(--bg);padding:0 4px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);padding:0 20px 14px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-right:6px;border:1px solid var(--line)}
.mtg{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:4px 16px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.mtg:first-child{border-top:0}
.mtg .d{font:600 14px var(--mono);font-variant-numeric:tabular-nums}
.mtg .d span{display:block;font:400 12px var(--mono);color:var(--muted)}
.mtg b{font-weight:600}
.mtg .who{font-size:13px;color:var(--muted)}
.mtg.past{opacity:.72}

/* admin */
.anav{flex:1 1 220px;max-width:260px;display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.anav button{border:0;background:none;text-align:left;padding:10px 14px;border-radius:6px;cursor:pointer;color:var(--muted);min-height:40px}
.anav button[aria-current="true"]{background:var(--surface);color:var(--fg);font-weight:600}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow .txt{min-width:0}
.setrow b{font-weight:600;display:block;font-size:14.5px}
.setrow span{font-size:13px;color:var(--muted)}
.setrow select.inp{width:auto;min-width:180px}
.swatches{display:flex;gap:8px}
.swatches button{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--bg) inset}
.logo-box{width:120px;height:56px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;padding:4px}
.user{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)}
.user:first-child{border-top:0}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 12.5px var(--sans);flex:none;background:var(--surface);border:1px solid var(--line)}
.av.me{background:var(--accent);color:var(--on-accent);border-color:var(--on-accent)}
.integ{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:18px 20px}
.integ>div{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.integ b{font-weight:600}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:8px;font-size:14px;font-weight:500;z-index:10;max-width:calc(100% - 32px)}

/* shared report views */
.preview{background:var(--warn-bg);border-bottom:1px solid var(--warn-line);color:var(--warn-fg);font-size:14px}
.preview .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding-block:8px}
.preview button{color:var(--warn-fg)}
.report{max-width:880px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:40px 64px;display:flex;flex-direction:column;gap:40px}
.rhead h1{font-size:clamp(28px,4vw,40px);font-weight:600;line-height:1.15;margin:10px 0 12px;max-width:22ch}
.rhead .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted)}
.lede{font-size:18px;line-height:1.6;max-width:62ch;margin:0}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{background:var(--bg);padding:16px 18px}
.facts b{display:block;font:600 28px var(--mono);font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted)}
.sec h2{font-size:21px;font-weight:600;margin-bottom:14px}
.theme{border-top:1px solid var(--line);padding:18px 0;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:8px 28px}
.theme:last-child{border-bottom:1px solid var(--line)}
.theme h3{font-size:17px;font-weight:600}
.theme p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:60ch}
.theme blockquote{grid-column:1/-1;margin:6px 0 0;padding:10px 14px;background:var(--surface);border-radius:6px;font-size:15px}
.theme blockquote cite{display:block;font:400 12.5px var(--mono);color:var(--muted);margin-top:4px;font-style:normal}
.recs{display:flex;flex-direction:column;gap:10px}
.rec{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:4px 14px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;align-items:start}
.rec .num{font:600 15px var(--mono);color:var(--accent-ink)}
.rec b{font-weight:600}
.rec p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.rec .when{font:500 12.5px var(--mono);color:var(--muted);white-space:nowrap}
.rec .resp{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:0 14px;min-height:36px;cursor:pointer;font-size:13px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:600}
.timeline{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:92px 18px minmax(0,1fr);gap:14px;padding-bottom:18px}
.step .d{font:500 13px var(--mono);color:var(--muted);text-align:right;padding-top:1px}
.step .dot{position:relative}
.step .dot::before{content:"";position:absolute;left:4px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent-ink)}
.step .dot::after{content:"";position:absolute;left:8px;top:18px;bottom:-18px;width:2px;background:var(--line)}
.step:last-child .dot::after{display:none}
.step.done .dot::before{background:var(--fg)}
.step b{font-weight:600;display:block}
.step span{font-size:14px;color:var(--muted)}
.fine{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.empty{padding:20px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:15px}
.heard{display:flex;flex-direction:column;gap:12px}
.heard>div{padding:16px 18px;border-left:3px solid var(--accent-ink);background:var(--surface);border-radius:0 8px 8px 0}
.heard b{font-weight:600;font-size:17px;display:block}
.heard span{color:var(--muted)}
.heard .resp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cards2>div{border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.cards2 b{display:block;font-weight:600;margin-bottom:4px}
.cards2 p{margin:0;font-size:14px;color:var(--muted)}
.contact{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:18px 20px;background:var(--surface);border-radius:10px}
.contact .addr{font-family:var(--mono);user-select:all}
.respbox{border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.respbox textarea{min-height:110px}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .srcs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .anav{position:static;max-width:none;flex-direction:row;flex-wrap:wrap}
}
@media (max-width:640px){
  .theme{grid-template-columns:minmax(0,1fr)}
  .facts,.cards2,.grid2,.grid3,.integ{grid-template-columns:minmax(0,1fr)}
  .rec{grid-template-columns:28px minmax(0,1fr)}
  .rec .when{grid-column:2}
  .step{grid-template-columns:64px 18px minmax(0,1fr)}
  .found{border-left:0;border-top:1px solid var(--line)}
  .ilist{max-width:none}
  .mtg{grid-template-columns:70px minmax(0,1fr)}
  .mtg .actions{grid-column:2}
  .setrow{flex-wrap:wrap}
}
@media (prefers-reduced-motion: reduce){.wave path{animation:none}*{transition:none!important}}
</style>

  var ev = cur.ev.map(function(e){return '<div class="ev"><q>'+esc(e[0])+'</q><span>'+esc(e[1])+'</span></div>';}).join('');

  '<section class="panel" aria-label="Themes and who sees them"><div class="panel-h"><h2>Themes and who sees them</h2><span class="muted small">You always see everything</span></div>'+
  '<div class="tablebox"><table class="syntable"><thead><tr><th scope="col">THEME</th><th scope="col" style="width:180px">HEARD FROM</th><th scope="col" class="c" style="width:96px">SPONSOR</th><th scope="col" class="c" style="width:120px">INTERVIEWEES</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<div class="tnote">A theme heard from fewer than '+S.minGroup+' people is locked, so no one can be identified from it. <button type="button" class="link" data-tab="admin" data-adm="sharing">Change rule</button></div></section>'+
  '<section class="panel pad" aria-label="Evidence"><div class="eyebrow">Evidence · with names · coach only</div><h2 style="font-size:20px;margin:6px 0 14px">'+esc(cur.title)+'</h2><div class="stack">'+ev+'</div></section></div>'+
  '<aside class="side">'+confirm+
  '<section class="panel views" aria-label="Shared views"><div class="darkhead">Shared views</div>'+
  '<div class="vrow"><div class="vtop"><b>Exec sponsor</b>'+stat+'</div><span class="muted" style="font-size:14px">Raj Patel, COO · '+spN+' themes · quotes without names · recommendations</span><div><button type="button" class="link" data-preview="sponsor">Preview as sponsor →</button></div></div>'+
  '<div class="vrow"><div class="vtop"><b>Interviewees</b>'+stat+'</div><span class="muted" style="font-size:14px">11 people · '+tmN+' themes · plain-language summary</span><div><button type="button" class="link" data-preview="team">Preview as interviewee →</button></div></div></section>'+
  sponsorFb+
  '<section class="panel pad" style="background:var(--surface)" aria-label="Your private notes"><h2 style="font-size:15px;margin-bottom:10px">Your private notes</h2><ul class="plain"><li>Reopened decisions look tied to 1:1s with Raj. Raise it with him directly before he reads the view.</li><li>Fresno and Modesto describe the same week very differently. Worth a joint session.</li><li>Maintenance-crew friction: follow up one to one, not in the group readout.</li></ul></section>'+

  '</aside></div></main>';
}
function shownIdx(kind){var a=[];themes.forEach(function(t,i){if(S[kind][i]&&!locked(t))a.push(i);});return a;}

/* ---------- timeline ---------- */
function pct(d){return (d/RANGE*100).toFixed(2)+'%';}
function timelineView(){
  var mcols = months.map(function(m){return m[1]+'fr';}).join(' ');
  var mh = months.map(function(m){return '<span>'+m[0]+'</span>';}).join('');
  var rows = phases.map(function(p){
    var cls = p.e < TODAY ? 'done' : (p.s <= TODAY ? 'now' : 'next');
    return '<div class="grow2"><div class="gl"><b>'+esc(p.name)+'</b><span>'+esc(p.sub)+'</span></div><div class="gtrack"><div class="gbar '+cls+'" style="left:'+pct(p.s)+';width:'+pct(p.e-p.s)+'" title="'+esc(p.name)+'"></div><div class="gtoday" style="left:'+pct(TODAY)+'"></div></div></div>';
  }).join('');
  var ms = '<div class="grow2"><div class="gl"><b>Key meetings</b><span>Sponsor and group</span></div><div class="gtrack">'+meetings.filter(function(m){return m.kind==='Sponsor'||m.kind==='Group';}).map(function(m){return '<span class="gms" style="left:'+pct(m.day)+'" title="'+esc(m.d+' · '+m.title)+'"></span>';}).join('')+'<div class="gtoday" style="left:'+pct(TODAY)+'"></div></div></div>';
  var mlist = meetings.map(function(m){
    var past = m.day < TODAY;
    return '<div class="mtg'+(past?' past':'')+'"><div class="d">'+m.d+'<span>'+m.wd+'</span></div><div><b>'+esc(m.title)+'</b><div class="who">'+esc(m.who)+'</div></div><div class="actions">'+(past?'<span class="pill neutral">DONE</span>':'<span class="pill '+(m.kind==='Sponsor'?'info':'neutral')+'">'+m.kind.toUpperCase()+'</span>')+'</div></div>';
  }).join('');
  var form = S.addMtg ? '<form id="mtgForm" class="pad stack" style="border-bottom:1px solid var(--line);background:var(--surface2)"><div class="grid3"><div class="field"><label for="mt">Meeting</label><input id="mt" required placeholder="e.g. Coaching session 2"></div><div class="field"><label for="md">Date</label><input id="md" type="date" value="2026-11-18" min="2026-09-01" max="2027-01-31" required></div><div class="field"><label for="mk">Type</label><select id="mk"><option>Coaching</option><option>Sponsor</option><option>Group</option><option>Interview</option><option>Milestone</option></select></div></div><div class="field"><label for="mw">Who and where</label><input id="mw" placeholder="Raj Patel · 60 min · Teams"></div><div class="actions"><button class="btn primary" type="submit">Add to timeline</button><button class="btn quiet" type="button" data-act="cancelMtg">Cancel</button></div></form>' : '';
  return '<main class="wrap"><div class="stack" style="gap:24px">'+
  '<section class="panel" aria-label="Project timeline"><div class="panel-h"><h2>Project timeline</h2><span class="muted small">1 Sep 2026 – 31 Jan 2027</span></div><div class="tablebox"><div class="gantt">'+
  '<div class="gscale"><span></span><div class="gmonths" style="grid-template-columns:'+mcols+'">'+mh+'<span class="gtoday-l" style="left:'+pct(TODAY)+'">TODAY 7 OCT</span></div></div>'+rows+ms+'</div></div>'+
  '<div class="legend"><span><i style="background:var(--fg);border-color:var(--fg)"></i>Done</span><span><i style="background:var(--accent)"></i>In progress</span><span><i style="background:var(--surface);border-style:dashed"></i>Planned</span><span><i style="background:var(--accent-ink);transform:rotate(45deg);width:10px"></i>Key meeting</span></div></section>'+
  '<div class="cols"><section class="panel grow" aria-label="Meetings"><div class="panel-h"><h2>Meetings and milestones</h2><span class="muted small">'+meetings.length+' items · synced with Outlook</span></div>'+form+mlist+'</section>'+
  '<aside class="side"><section class="panel pad stack" aria-label="Shown to others"><h2 style="font-size:15px">Shown to others</h2><div class="setrow" style="padding:0;border:0"><div class="txt"><b>Sponsor view</b><span>Next steps from 14 Oct</span></div>'+sw('data-tlshow="sp"',true,'Show next steps in sponsor view')+'</div><div class="setrow" style="padding:0;border:0"><div class="txt"><b>Interviewee view</b><span>Pulse check date only</span></div>'+sw('data-tlshow="tm"',true,'Show pulse check date in interviewee view')+'</div></section>'+
  '<section class="panel pad stack" aria-label="Reminders"><h2 style="font-size:15px">Reminders</h2><ul class="plain"><li>Interviewees get a reminder 2 days before their interview.</li><li>You get a prep brief the morning of each sponsor meeting.</li></ul></section></aside></div>'+
  '</div></main>';
}

/* ---------- render + events ---------- */
function render(){
  document.querySelectorAll('.roles button').forEach(function(b){b.setAttribute('aria-pressed', String(b.dataset.role===S.role));});
  var h;
  if (S.role==='coach') {
    var v = {overview:overviewView, intake:intakeView, notes:notesView, syn:synView, timeline:timelineView, people:peopleView, admin:adminView}[S.tab]();
    h = coachHead()+v;
  } else if (S.role==='sponsor') h = sponsorView();
  else h = teamView();
  app.innerHTML = h;
  wire();
}
function wire(){
  var ta = document.getElementById('notes');
  if (ta) ta.addEventListener('input', function(){ interviews[S.cur].notes = ta.value; var s=document.getElementById('saved'); if(s) s.textContent='Saved · just now'; });
  var af = document.getElementById('addForm');
  if (af) { af.addEventListener('submit', function(e){ e.preventDefault(); var n=document.getElementById('nn').value.trim(), r=document.getElementById('nr').value.trim(); if(!n||!r) return;
    var dv=document.getElementById('nd').value, dt=dv?new Date(dv+'T12:00:00'):null, ds=dt?dt.getDate()+' '+dt.toLocaleString('en-GB',{month:'short'}):'TBC';
    interviews.push({name:n,role:r,date:ds,status:'sch',src:'',consent:'pending',invite:'not',notes:'',themes:[]}); S.cur=interviews.length-1; S.adding=false; render(); toast('Interview added for '+ds); });
    document.getElementById('nn').focus(); }
  var mf = document.getElementById('mtgForm');
  if (mf) { mf.addEventListener('submit', function(e){ e.preventDefault(); var t=document.getElementById('mt').value.trim(), dv=document.getElementById('md').value; if(!t||!dv) return;
    var dt=new Date(dv+'T12:00:00'), day=Math.round((dt-new Date('2026-09-01T12:00:00'))/864e5);
    meetings.push({d:dt.getDate()+' '+dt.toLocaleString('en-GB',{month:'short'}), day:day, wd:dt.toLocaleString('en-GB',{weekday:'short'}), title:t, who:document.getElementById('mw').value.trim()||'Details to come', kind:document.getElementById('mk').value});
    meetings.sort(function(a,b){return a.day-b.day;}); S.addMtg=false; render(); toast('Added to the timeline'); });
    document.getElementById('mt').focus(); }
  var tf = document.getElementById('teamForm');
  if (tf) tf.addEventListener('submit', function(e){ e.preventDefault(); S.teamSent=true; render(); });
  var fi = document.getElementById('fileIn'), drop = document.getElementById('drop');
  if (fi) fi.addEventListener('change', function(){ addFiles(fi.files); });
  if (drop) {
    ['dragenter','dragover'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add('over');});});
    ['dragleave','drop'].forEach(function(ev){drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove('over');});});
    drop.addEventListener('drop', function(e){ if(e.dataTransfer&&e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
  }
}
function kindOf(n){var x=n.split('.').pop().toLowerCase();return /^(mp3|m4a|wav|aac)$/.test(x)?'Audio':/^(vtt|srt)$/.test(x)?'Meeting transcript':/^(jpg|jpeg|png|heic)$/.test(x)?'Scanned notes':x==='eml'?'Email':x==='pdf'?'PDF':'Document';}
function sizeOf(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';}
function addFiles(list){
  Array.prototype.forEach.call(list, function(f){
    var k=kindOf(f.name), u={file:f.name, kind:k, size:sizeOf(f.size), when:'Just now', status:k==='Audio'?'trans':'reading', match:-1};
    uploads.unshift(u);
    setTimeout(function(){
      var hit=-1; interviews.forEach(function(i,ix){ if(f.name.toLowerCase().indexOf(i.name.split(' ')[1].toLowerCase())>=0) hit=ix; });
      if (hit>=0){ u.status='ready'; u.match=hit; if(k==='Audio') u.note='Transcribed'; } else u.status='match';
      if (S.role==='coach'&&S.tab==='intake') render();
      toast(hit>=0?f.name+' matched to '+interviews[hit].name:f.name+' is ready. Choose its interview.');
    }, k==='Audio'?2600:1500);
  });
  render();
}

document.addEventListener('click', function(e){

  if (d.role) { S.role=d.role; S.previewFrom=null; S.confirm=false; render(); window.scrollTo(0,0); return; }

  if (d.tr) { S.themeResp[d.tr]=d.v; render(); return; }
  switch (d.act) {
    case 'read': S.reading=true; render(); setTimeout(function(){ S.reading=false; S.analyzed[S.cur]=true; if(!interviews[S.cur].themes.length) interviews[S.cur].themes=[0]; render(); }, 1400); break;
    case 'add': S.adding=true; S.tab='notes'; render(); break;

    case 'copyInbox': copyText('meridian-ops@in.throughline.example'); break;

    case 'addMtg': S.addMtg=true; render(); break;
    case 'cancelMtg': S.addMtg=false; render(); break;
    case 'calsync': toast('Timeline synced with Outlook'); break;
    case 'remind': toast('Reminders sent to 7 people who haven\'t opened their invite'); break;
    case 'invite': toast('Invites go out when you publish the views'); break;
    case 'askApproval': toast('Quote approval requests sent to Ravi Menon and Mei Lin'); break;
    case 'saveAdmin': toast('Settings saved'); break;
    case 'exportAll': toast('Export started. You\'ll get a download link by email.'); break;
    case 'exportLog': toast('Audit log exported'); break;
    case 'delProj': S.delConfirm=true; render(); break;
    case 'delNo': S.delConfirm=false; render(); break;
    case 'logo': toast('Logo upload: PNG or SVG, at least 240 px wide'); break;
    case 'inviteCoach': toast('Invite sent'); break;
  }
});
function copyText(t){ try{ navigator.clipboard.writeText(t).then(function(){toast('Copied');},function(){toast('Select the address to copy it');}); }catch(err){ toast('Select the address to copy it'); } }
document.addEventListener('change', function(e){
  var i = e.target, d = i.dataset || {};
  if (d.sw) { S[d.sw][+d.i] = i.checked; S.sel=+d.i; render(); toast((i.checked?'Shown in ':'Hidden from ')+(d.sw==='sp'?'sponsor':'interviewee')+' view'); var again=document.querySelector('input[data-sw="'+d.sw+'"][data-i="'+d.i+'"]'); if(again) again.focus(); return; }
  if (d.todo) { S.todos[d.todo]=i.checked; render(); var t=document.getElementById('td-'+d.todo); if(t) t.focus(); return; }
  if (d.match) { var u=uploads[+d.match]; u.match=+i.value; u.status='ready'; S.todos.match=true; render(); toast('Matched to '+interviews[u.match].name); return; }
  if (d.tog) { S[d.tog]=i.checked; toast('Updated'); return; }
  if (d.set) { S[d.set] = d.set==='minGroup' ? +i.value : i.value; toast(d.set==='minGroup'?'Themes from fewer than '+i.value+' people are now locked':'Updated'); return; }
  if (d.tlshow) { toast(i.checked?'Shown':'Hidden'); return; }
});
render();
})();
</script>
